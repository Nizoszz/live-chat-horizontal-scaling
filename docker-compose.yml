# Docker Compose para demonstração de escala horizontal com Spring WebSocket + Redis
# 
# Arquitetura:
#   - nginx: Load balancer + servidor do frontend estático
#   - server-1, server-2, server-3: Três instâncias Spring Boot
#   - redis: Backplane para Pub/Sub entre as instâncias
#
# Para executar: docker-compose up --build

services:
  # Redis - canal Pub/Sub entre as instâncias
  # Responsável por propagar mensagens entre todas as instâncias
  redis:
    image: redis:8-alpine
    container_name: chat-redis
    ports:
      - "6379:6379"
    networks:
      - chat-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Servidor 1
  server-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chat-server-1
    environment:
      SERVER_ID: Server-1
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - chat-network
    expose:
      - "8080"

  # Servidor 2
  server-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chat-server-2
    environment:
      SERVER_ID: Server-2
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - chat-network
    expose:
      - "8080"

  # Servidor 3
  server-3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chat-server-3
    environment:
      SERVER_ID: Server-3
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - chat-network
    expose:
      - "8080"

  # Nginx - Load Balancer + Frontend Estático
  # Serve o frontend e distribui conexões WebSocket entre os servidores
  nginx:
    image: nginx:alpine
    container_name: chat-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - server-1
      - server-2
      - server-3
    networks:
      - chat-network

networks:
  chat-network:
    driver: bridge
